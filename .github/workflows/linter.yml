name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting and lint every crate
        shell: bash
        run: |
          set -uo pipefail
          failures=()

          for manifest in */Cargo.toml; do
            crate="${manifest%/Cargo.toml}"
            echo "::group::${crate}"

            if ! cargo fmt --manifest-path "$manifest" -- --check; then
              failures+=("$crate: formatting")
            fi

            if ! cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings; then
              failures+=("$crate: Clippy")
            fi

            echo "::endgroup::"
          done

          if ((${#failures[@]} > 0)); then
            echo "Lint failures:"
            printf ' - %s\n' "${failures[@]}"
            exit 1
          fi
